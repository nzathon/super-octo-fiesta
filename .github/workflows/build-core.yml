name: Build Core

on:
  push:
    paths:
      - 'azalea-core.zip'
      - 'rust/**'
      - 'app/src/main/assets/**'
      - 'web/**'
      - '.github/workflows/build-core.yml'
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bongkar zip core
        run: |
          unpack_zip() {
            local z="$1"
            [ -f "$z" ] || return 0
            echo "Membongkar $z"
            rm -rf _x && mkdir _x
            unzip -oq "$z" -d _x
            local count first
            count=$(ls -A _x | wc -l)
            first=$(ls -A _x | head -1)
            if [ "$count" = "1" ] && [ -d "_x/$first" ]; then
              cp -rf "_x/$first"/. .
            else
              cp -rf _x/. .
            fi
            rm -rf _x
          }

          if [ -f azalea-core.zip ]; then
            unpack_zip "azalea-core.zip"
          elif [ -f azalea-app.zip ] && [ ! -f rust/Cargo.toml ]; then
            unpack_zip "azalea-app.zip"
          fi
          test -f rust/Cargo.toml || { echo "rust/Cargo.toml tidak ditemukan"; ls -la; exit 1; }
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Bangun inti Azalea (Rust)
        run: |
          cd rust
          cargo ndk -t arm64-v8a -P 26 build --release
      - name: Kemas bundel core-pack
        run: |
          rm -rf core-pack
          mkdir -p core-pack/web
          cp rust/target/aarch64-linux-android/release/azalea-core core-pack/azalea-core
          chmod +x core-pack/azalea-core
          cp rust/CORE_CONTEXT.md core-pack/CORE_CONTEXT.md
          if [ -d app/src/main/assets ]; then
            cp -r app/src/main/assets/. core-pack/web/
          fi
          if [ -d web ]; then
            cp -r web/. core-pack/web/
          fi
          CORE_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)
          printf '{"core_version":"%s","run_number":"%s","sha":"%s"}\n' "$CORE_VER" "${{ github.run_number }}" "${{ github.sha }}" > core-pack/manifest.json
          ls -lh core-pack/ core-pack/web/
      - uses: actions/upload-artifact@v4
        with:
          name: azalea-core-pack
          path: core-pack/
