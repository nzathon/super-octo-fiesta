name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kalau ada file .zip di root repo (hasil unggah dari HP), bongkar dulu.
      # Isi zip yang punya satu folder paling luar otomatis dipindah ke root.
      - name: Bongkar zip proyek
        run: |
          z=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -n "$z" ]; then
            echo "Membongkar $z"
            rm -rf _x && mkdir _x
            unzip -oq "$z" -d _x
            if [ "$(ls -A _x | wc -l)" = "1" ] && [ -d "_x/$(ls _x)" ]; then
              cp -r "_x/$(ls _x)"/. .
            else
              cp -r _x/. .
            fi
            rm -rf _x
          else
            echo "Tidak ada zip, memakai file di repo apa adanya"
          fi
          test -f app/build.gradle.kts || { echo "app/build.gradle.kts tidak ditemukan"; ls -la; exit 1; }
          test -f rust/Cargo.toml || { echo "rust/Cargo.toml tidak ditemukan"; ls -la; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Bangun inti Azalea (Rust)
        run: |
          cd rust
          cargo ndk -t arm64-v8a -P 26 build --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/blockchat-azalea ../app/src/main/jniLibs/arm64-v8a/libazalea.so
          ls -lh ../app/src/main/jniLibs/arm64-v8a/

      - run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: blockchat-mf-apk
          path: app/build/outputs/apk/debug/*.apk
