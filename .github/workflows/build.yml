name: Build APK

on:
  push:
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bongkar zip proyek
        run: |
          z=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -n "$z" ]; then
            echo "Membongkar $z"
            rm -rf _x && mkdir _x
            unzip -oq "$z" -d _x
            if [ "$(ls -A _x | wc -l)" = "1" ] && [ -d "_x/$(ls _x)" ]; then
              cp -r "_x/$(ls _x)"/. .
            else
              cp -r _x/. .
            fi
            rm -rf _x
          else
            echo "Tidak ada zip, memakai file di repo apa adanya"
          fi
          test -f rust/Cargo.toml || { echo "rust/Cargo.toml tidak ditemukan"; ls -la; exit 1; }
          test -f app/build.gradle.kts || { echo "app/build.gradle.kts tidak ditemukan"; ls -la; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Periksa API azalea (info untuk diagnosa)
        continue-on-error: true
        run: |
          cd rust
          cargo fetch 2>&1 | tail -2
          d=$(ls -d ~/.cargo/git/checkouts/azalea-*/*/ | head -1)
          echo "== JoinOpts =="; grep -rn "custom_resolved_address\|pub struct JoinOpts" "$d" --include=*.rs | head -10
          echo "== RESOLVER =="; grep -rn "RESOLVER" "$d" --include=*.rs | head -10
          echo "== start_with_opts =="; grep -rn "fn start_with_opts" "$d" --include=*.rs | head -10
      - name: Bangun inti Azalea (Rust)
        run: |
          cd rust
          cargo ndk -t arm64-v8a -P 26 build --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/azalea-core ../app/src/main/jniLibs/arm64-v8a/libazalea.so
          ls -lh ../app/src/main/jniLibs/arm64-v8a/
      - name: Kemas bundel core-pack
        run: |
          rm -rf core-pack
          mkdir -p core-pack/web
          cp rust/target/aarch64-linux-android/release/azalea-core core-pack/azalea-core
          chmod +x core-pack/azalea-core
          cp rust/CORE_CONTEXT.md core-pack/CORE_CONTEXT.md
          if [ -d app/src/main/assets ]; then
            cp -r app/src/main/assets/. core-pack/web/
          fi
          if [ -d web ]; then
            cp -r web/. core-pack/web/
          fi
          CORE_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)
          printf '{"core_version":"%s","run_number":"%s","sha":"%s"}\n' "$CORE_VER" "${{ github.run_number }}" "${{ github.sha }}" > core-pack/manifest.json
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: azalea-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: azalea-core-pack
          path: core-pack/
